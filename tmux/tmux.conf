# 256 colors inside tmux, true color from the outer terminal (iTerm2)
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# No delay after Esc (nvim's :checkhealth asks for this), and pass focus
# events through so nvim can reload files changed outside it.
set -sg escape-time 0
set -g focus-events on

# Enable mouse
set -g mouse on

# Ctrl-a as a second prefix (GNU Screen style), Ctrl-b still works
set -g prefix2 C-a
bind C-a send-prefix -2

# Use vi mode
set-window-option -g mode-keys vi

######################
#### Key Bindings ####
######################

# reload config file
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Creates a 3 pane layout for development
bind e split-window -h -p 27 \; split-window -v \; select-pane -L # \; setw synchronize-panes
bind w choose-window

# Closes all panes and exits tmux
bind q kill-pane -a \; kill-pane

# synchronize all panes in a window
bind y setw synchronize-panes

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 11

# Maximize pane
bind m resize-pane -Z

# Vi mode copy
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Theme: https://github.com/jimeh/tmux-themepack, cloned by `mise bootstrap`
source-file "${HOME}/.tmux-themepack/basic.tmuxtheme"
