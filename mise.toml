"brew:ffmpeg" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:go" = "latest"
"brew:helm" = "latest"
"brew:k3d" = "latest"
"brew:k6" = "latest"
"brew:kubeconform" = "latest"
"brew:lazydocker" = "latest"
"brew:lazygit" = "latest"
"brew:luarocks" = "latest"
"brew:neovim" = "latest"
"brew:nnn" = "latest"
"brew:opencode" = "latest"
"brew:pandoc" = "latest"
"brew:ripgrep" = "latest"
"brew:poppler" = "latest"
"brew:tectonic" = "latest"
"brew:thefuck" = "latest"
"brew:tmux" = "latest"
"brew:tree-sitter" = "latest"
"brew:tree-sitter-cli" = "latest"
