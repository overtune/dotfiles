# Dotfiles for this machine, managed by mise. Run from this directory.
# New machine: `mise trust && mise bootstrap` (see README).
# Sources are relative to this file; default mode is symlink.

[dotfiles]
"~/.zshrc"                 = { source = "zsh/zshrc" }
"~/.zshenv"                = { source = "zsh/zshenv" }
"~/.tmux.conf"             = { source = "tmux/tmux.conf" }
"~/.config/nvim-overtune"  = { source = "nvim-overtune" }
"~/.config/mise/config.toml" = { source = "mise/config.toml" }

# `mise bootstrap` sets up a new machine: installs packages, clones repos,
# then deploys [dotfiles]. Safe to re-run; anything already in place is
# left alone. Preview with `mise bootstrap --dry-run`.

[bootstrap.repos]
"~/.oh-my-zsh"       = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.tmux-themepack"  = { url = "https://github.com/jimeh/tmux-themepack.git" }

[bootstrap.packages]
"brew:azure-cli" = "latest"
"brew:fd" = "latest"
